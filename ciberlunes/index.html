<body>
  <div class="topbar">
    <span class="brand">SIMBA</span>

  <div class="container">
    <div id="page-root">Cargando...</div>

  <footer class="site-footer">SIMBA Kids UY · Ciberlunes</footer>

  <script src="config.js"></script>
  <script src="products.js"></script>
  <script src="packs.js"></script>
  <script src="data-source.js"></script>
  <script src="gate.js"></script>
  <script>
    function cardHTML(pack) {
      return `
        <a class="pack-card" href="${ciberLink(`pack.html?slug=${pack.slug}`)}">
          <div class="card-image-wrap">
            <img src="${pack.image}" alt="${pack.name}" loading="lazy">
            <span class="badge">${pack.discount}% OFF</span>
          </div>
          <div class="info">
            <div class="name">${pack.name}</div>
            <div class="subtitle">${pack.subtitle}</div>
          </div>
        </a>`;
    }

    async function init() {
      const root = document.getElementById("page-root");
      const status = await ciberStatus();
      if (status !== "open") {
        root.innerHTML = ciberClosedHTML(status);
        return;
      }
      const packs = await getPacks();
      root.innerHTML = `
        <div class="hero">
          <span class="discount-badge hero-badge">🔥 CIBERLUNES · HASTA 40% OFF</span>
          <h1>Ciberlunes SIMBA</h1>
          <p>Elegí tu pack con descuento, mirá los diseños disponibles, seleccioná los tuyos y enviámelos por WhatsApp.</p>
        </div>
        <div class="pack-grid">${packs.map(cardHTML).join("")}</div>`;
    }

    init();
  </script>
