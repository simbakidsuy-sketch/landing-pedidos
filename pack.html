<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Elegí tus diseños | SIMBA Kids UY</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="topbar">
    <span class="brand">SIMBA</span>
    <span class="tagline">Elegí los diseños de tu pedido</span>
  </div>

  <div class="container">
    <a class="back-link" href="index.html">&larr; Volver a todos los packs</a>

    <div id="pack-root">Cargando...</div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="data/products.js"></script>
  <script src="data/packs.js"></script>
  <script src="assets/js/data-source.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const slug = params.get("slug");
    const root = document.getElementById("pack-root");

    const SHIPPING_OPTIONS = {
      pickup: {
        title: "Retiro en Aguada",
        detail: "A una cuadra del Palacio Legislativo. Coordinamos el retiro luego de confirmada la venta.",
        message: "Retiro en Aguada",
        cost: 0
      },
      montevideo: {
        title: "Envío en Montevideo — +$U 200",
        detail: "Se suma al total del pedido.",
        message: "Envío en Montevideo",
        cost: 200
      },
      interior: {
        title: "Envío al resto del país (DAC)",
        detail: "El costo del envío se abona al recibir el pedido.",
        message: "Envío por DAC",
        cost: 0
      }
    };

    const PAYMENT_OPTIONS = {
      transferencia: {
        title: "Transferencia bancaria o depósito",
        detail: "Redes de cobranza (Abitab, Redpagos, etc.)",
        message: "Transferencia bancaria / depósito en redes de cobranza"
      },
      tarjeta: {
        title: "Link de pago con tarjeta",
        detail: "Hasta 12 cuotas sin recargo.",
        message: "Link de pago con tarjeta (hasta 12 cuotas sin recargo)"
      }
    };

    const SHIPPING_FIELD_LABELS = {
      nombre: "Nombre y apellido",
      direccion: "Dirección de entrega",
      localidad: "Localidad y departamento",
      celular: "Celular de contacto"
    };

    function shippingFieldKeys() {
      if (selectedShipping === "montevideo") return ["nombre", "direccion", "celular"];
      if (selectedShipping === "interior") {
        if (dacMode === "agencia") return ["nombre", "localidad", "celular"];
        if (dacMode === "domicilio") return ["nombre", "direccion", "localidad", "celular"];
        return null;
      }
      return [];
    }

    function shippingFieldsHTML(keys) {
      if (!keys || keys.length === 0) return "";
      return `<div class="shipping-fields">` + keys.map(k => `
        <div class="field-group">
          <label>${SHIPPING_FIELD_LABELS[k]}</label>
          <input type="text" class="field-input" data-key="${k}" value="${(shippingFields[k] || "").replace(/"/g, "&quot;")}" placeholder="${SHIPPING_FIELD_LABELS[k]}">
        </div>`).join("") + `</div>`;
    }

    function shippingOptionsHTML() {
      return Object.entries(SHIPPING_OPTIONS).map(([value, opt]) => `
        <div class="option-card-wrap" data-group="shipping" data-value="${value}">
          <label class="option-card">
            <input type="radio" name="shipping" value="${value}">
            <div class="option-text">
              <strong>${opt.title}</strong>
              <span>${opt.detail}</span>
            </div>
          </label>
          <div class="option-inline-extra" id="extra-${value}"></div>
        </div>`).join("");
    }

    function renderShippingDetails(pack) {
      Object.keys(SHIPPING_OPTIONS).forEach(v => {
        const el = document.getElementById(`extra-${v}`);
        if (el) el.innerHTML = "";
      });
      const container = document.getElementById(`extra-${selectedShipping}`);
      if (!container) return;

      if (selectedShipping === "interior") {
        const dacOption = (value, label) => `
          <label class="option-card ${dacMode === value ? "selected" : ""}">
            <input type="radio" name="dac-mode" value="${value}" ${dacMode === value ? "checked" : ""}>
            <div class="option-text"><strong>${label}</strong></div>
          </label>`;
        container.innerHTML =
          `<div class="option-list dac-mode-list">${dacOption("agencia", "Retiro en agencia")}${dacOption("domicilio", "Enviar a mi domicilio")}</div>` +
          shippingFieldsHTML(shippingFieldKeys());

        container.querySelectorAll('input[name="dac-mode"]').forEach(r => {
          r.addEventListener("change", e => {
            dacMode = e.target.value;
            renderShippingDetails(pack);
            updateSendState(pack);
          });
        });
      } else {
        container.innerHTML = shippingFieldsHTML(shippingFieldKeys());
      }

      container.querySelectorAll(".field-input").forEach(input => {
        input.addEventListener("input", e => {
          shippingFields[e.target.dataset.key] = e.target.value;
          updateSendState(pack);
        });
      });
    }

    function formatMoney(n) {
      return "$U " + n.toLocaleString("es-UY");
    }

    function sortedVariants(variants) {
      return variants.slice().sort((a, b) => a.title.localeCompare(b.title, "es"));
    }

    function galleryHTML(variants, ci) {
      return sortedVariants(variants).map(v => {
        const out = v.stock <= 0;
        const low = !out && v.stock <= 3;
        return `
        <div class="thumb-wrap ${out ? "out" : ""}" data-ci="${ci}" data-title="${v.title}">
          <div class="thumb ${out ? "out" : ""}">
            <img src="${v.image}" alt="${v.title}" loading="lazy">
            ${low ? '<div class="low-badge">🔥 ¡ÚLTIMAS UNIDADES!</div>' : ""}
            ${out ? '<div class="out-label">SIN STOCK</div>' : ""}
            <div class="count-badge"></div>
          </div>
          <div class="thumb-name">${v.title}</div>
        </div>`;
      }).join("");
    }

    function compProgressText(comp, total) {
      if (comp.qty === null) {
        return total > 0 ? `Elegiste ${total} diseño${total > 1 ? "s" : ""}` : "Elegí los que quieras";
      }
      return total >= comp.qty ? `✅ Elegiste tus ${comp.qty} diseño${comp.qty > 1 ? "s" : ""}` : `Elegiste ${total} de ${comp.qty}`;
    }

    function componentSatisfied(comp, total) {
      return comp.qty === null ? total >= 1 : total >= comp.qty;
    }

    function renderBadges(pack, ci) {
      const comp = pack.components[ci];
      const galleryEl = document.getElementById(`gallery-${ci}`);
      galleryEl.querySelectorAll(".thumb-wrap").forEach(wrap => {
        const count = selections[ci][wrap.dataset.title] || 0;
        const thumb = wrap.querySelector(".thumb");
        const badge = wrap.querySelector(".count-badge");
        thumb.classList.toggle("selected", count > 0);
        badge.textContent = count > 0 ? String(count) : "";
      });

      const total = countFor(ci);
      document.getElementById(`comp-progress-${ci}`).textContent = compProgressText(comp, total);
      document.getElementById(`clear-${ci}`).style.display = total > 0 ? "inline-flex" : "none";
      updatePriceDisplay(pack);
    }

    let selections = {};
    let variantStock = {};
    let selectedShipping = "";
    let selectedPayment = "";
    let selectedUpsell = null;
    let dacMode = "";
    let shippingFields = {};

    function countFor(ci) {
      return Object.values(selections[ci] || {}).reduce((a, b) => a + b, 0);
    }

    function selectedUpsellOption(pack) {
      if (!pack.upsell || !selectedUpsell) return null;
      return pack.upsell.options.find(o => o.id === selectedUpsell) || null;
    }

    function updatePriceDisplay(pack) {
      const mainEl = document.getElementById("price-main");
      const breakdownEl = document.getElementById("price-breakdown");
      if (!mainEl || !breakdownEl) return;

      const shippingCost = selectedShipping ? SHIPPING_OPTIONS[selectedShipping].cost : 0;
      const upsellOpt = selectedUpsellOption(pack);
      const upsellCost = upsellOpt ? upsellOpt.price : 0;

      let base;
      const parts = [];

      if (pack.mode === "individual") {
        const totalUnits = pack.components.reduce((sum, c, ci) => sum + countFor(ci), 0);
        base = pack.unitPrice * totalUnits;
        mainEl.textContent = `${formatMoney(pack.unitPrice)} c/u`;
        if (totalUnits > 0) parts.push(`${totalUnits} unidad${totalUnits > 1 ? "es" : ""} × ${formatMoney(pack.unitPrice)}`);
      } else {
        base = pack.price;
        mainEl.textContent = formatMoney(pack.price);
      }

      if (upsellOpt) parts.push(`${upsellOpt.label} (${formatMoney(upsellCost)})`);
      if (shippingCost) parts.push(`${formatMoney(shippingCost)} envío`);

      if (parts.length === 0) { breakdownEl.innerHTML = ""; return; }
      const total = base + upsellCost + shippingCost;
      breakdownEl.innerHTML = `${parts.join(" + ")} = <span class="total">${formatMoney(total)}</span>`;
    }

    function updateSendState(pack) {
      const btn = document.getElementById("send-btn");
      const progress = document.getElementById("send-progress");
      const unmetIndex = pack.components.findIndex((c, ci) => !componentSatisfied(c, countFor(ci)));

      let blocking = null;
      if (unmetIndex !== -1) {
        const comp = pack.components[unmetIndex];
        blocking = comp.qty === null
          ? "Elegí al menos un diseño"
          : `Elegiste ${countFor(unmetIndex)} de ${comp.qty} diseños`;
      } else if (!selectedShipping) {
        blocking = "Elegí el envío o retiro";
      } else if (selectedShipping === "interior" && !dacMode) {
        blocking = "Elegí retiro en agencia o envío a domicilio";
      }

      if (!blocking && !selectedPayment) blocking = "Elegí el medio de pago";

      btn.disabled = !!blocking;
      progress.textContent = blocking || "¡Listo! Todo elegido.";
    }

    function buildWhatsAppLink(pack) {
      const shipping = SHIPPING_OPTIONS[selectedShipping];
      const payment = PAYMENT_OPTIONS[selectedPayment];

      const lines = [`Hola! Quiero pedir el *${pack.name}*:`];
      pack.components.forEach((comp, ci) => {
        Object.entries(selections[ci]).forEach(([title, count]) => {
          if (count <= 0) return;
          lines.push(`- ${comp.label}: ${title}${count > 1 ? ` (x${count})` : ""}`);
        });
      });
      const upsellOpt = selectedUpsellOption(pack);
      if (upsellOpt) lines.push(`Se agregó: ${upsellOpt.message}`);
      lines.push("");
      lines.push(`Envío/Retiro: ${shipping.message}`);
      if (selectedShipping === "interior" && dacMode) {
        lines.push(`Modalidad: ${dacMode === "agencia" ? "en agencia" : "a domicilio"}`);
      }
      (shippingFieldKeys() || []).forEach(k => {
        const val = (shippingFields[k] || "").trim();
        if (val) lines.push(`${SHIPPING_FIELD_LABELS[k]}: ${val}`);
      });
      lines.push("");
      lines.push(`Medio de Pago: ${payment.message}`);
      const text = encodeURIComponent(lines.join("\n"));
      return `https://wa.me/${window.SIMBA_CONFIG.whatsappNumber}?text=${text}`;
    }

    function upsellHTML(pack) {
      if (!pack.upsell) return "";
      const u = pack.upsell;
      const optionsHTML = u.options.map(o => `
        <div class="upsell-option" data-id="${o.id}">
          <strong>${o.label}</strong>
          <span>${formatMoney(o.price)}</span>
        </div>`).join("");
      const media = u.mediaType === "video"
        ? `<video class="upsell-media" src="${u.media}" autoplay loop muted playsinline></video>`
        : `<img class="upsell-media" src="${u.media}" alt="${u.title}" loading="lazy">`;
      return `
        <div class="upsell-block">
          <h3>${u.title}</h3>
          ${media}
          <p class="upsell-desc">${u.description}</p>
          <div class="upsell-options">${optionsHTML}</div>
        </div>`;
    }

    function optionCardsHTML(groupName, options) {
      return Object.entries(options).map(([value, opt]) => `
        <label class="option-card" data-group="${groupName}">
          <input type="radio" name="${groupName}" value="${value}">
          <div class="option-text">
            <strong>${opt.title}</strong>
            <span>${opt.detail}</span>
          </div>
        </label>`).join("");
    }

    async function init() {
      const [packs, products] = await Promise.all([getPacks(), getProducts()]);
      const pack = packs.find(p => p.slug === slug);

      if (!pack) {
        root.innerHTML = "<p>No encontramos ese pack. <a href='index.html'>Volver</a></p>";
        return;
      }

      document.getElementById("page-title").textContent = `${pack.name} | SIMBA Kids UY`;

      selections = {};
      variantStock = {};
      selectedUpsell = null;
      pack.components.forEach((c, i) => { selections[i] = {}; });

      const componentBlocks = pack.components.map((comp, ci) => {
        const prod = products[comp.product];
        variantStock[ci] = {};
        prod.variants.forEach(v => { variantStock[ci][v.title] = v.stock; });
        const qtyLabel = comp.qty === null ? " (elegí los que quieras)" : (comp.qty > 1 ? ` (elegí ${comp.qty})` : "");
        const hint = comp.qty === null
          ? "Tocá una foto para elegirla. Podés tocarla varias veces si querés más de una unidad del mismo diseño."
          : "Tocá una foto para elegirla. Si querés el mismo diseño más de una vez, tocala de nuevo.";
        return `
          <div class="component-block">
            <h3>${comp.label}${qtyLabel}</h3>
            <div class="hint">${hint}</div>
            <div class="gallery" id="gallery-${ci}">${galleryHTML(prod.variants, ci)}</div>
            <div class="comp-footer">
              <span class="comp-progress" id="comp-progress-${ci}">${compProgressText(comp, 0)}</span>
              <button type="button" class="clear-btn" id="clear-${ci}" style="display:none">Limpiar selección</button>
            </div>
          </div>`;
      }).join("");

      root.innerHTML = `
        <div class="pack-header">
          <img src="${pack.image}" alt="${pack.name}">
          <div class="meta">
            <h1>${pack.name}</h1>
            <div class="subtitle">${pack.subtitle}</div>
            <div class="price" id="price-main"></div>
            <div class="price-breakdown" id="price-breakdown"></div>
          </div>
        </div>
        ${componentBlocks}
        ${upsellHTML(pack)}
        <div class="component-block">
          <h3>Envío o retiro</h3>
          <div class="option-list" id="shipping-options">
            ${shippingOptionsHTML()}
          </div>
        </div>
        <div class="component-block">
          <h3>Medio de pago</h3>
          <div class="option-list" id="payment-options">
            ${optionCardsHTML("payment", PAYMENT_OPTIONS)}
          </div>
        </div>
        <div class="send-bar">
          <button class="send-btn" id="send-btn" disabled>Enviar info por WhatsApp</button>
          <div class="send-progress" id="send-progress"></div>
        </div>
      `;

      pack.components.forEach((comp, ci) => {
        root.querySelectorAll(`#gallery-${ci} .thumb-wrap:not(.out)`).forEach(wrap => {
          wrap.addEventListener("click", () => {
            const title = wrap.dataset.title;
            const current = selections[ci][title] || 0;
            if (comp.qty !== null && countFor(ci) >= comp.qty) return;
            if (current >= variantStock[ci][title]) return;
            selections[ci][title] = current + 1;
            renderBadges(pack, ci);
            updateSendState(pack);
          });
        });

        document.getElementById(`clear-${ci}`).addEventListener("click", () => {
          selections[ci] = {};
          renderBadges(pack, ci);
          updateSendState(pack);
        });
      });

      root.querySelectorAll('input[name="shipping"]').forEach(radio => {
        radio.addEventListener("change", e => {
          selectedShipping = e.target.value;
          if (selectedShipping !== "interior") dacMode = "";
          root.querySelectorAll('.option-card-wrap[data-group="shipping"]').forEach(card => {
            card.classList.toggle("selected", card.querySelector("input").checked);
          });
          renderShippingDetails(pack);
          updatePriceDisplay(pack);
          updateSendState(pack);
        });
      });

      root.querySelectorAll('input[name="payment"]').forEach(radio => {
        radio.addEventListener("change", e => {
          selectedPayment = e.target.value;
          root.querySelectorAll('.option-card[data-group="payment"]').forEach(card => {
            card.classList.toggle("selected", card.querySelector("input").checked);
          });
          updateSendState(pack);
        });
      });

      if (pack.upsell) {
        root.querySelectorAll(".upsell-option").forEach(el => {
          el.addEventListener("click", () => {
            const id = el.dataset.id;
            selectedUpsell = selectedUpsell === id ? null : id;
            root.querySelectorAll(".upsell-option").forEach(o => {
              o.classList.toggle("selected", o.dataset.id === selectedUpsell);
            });
            updatePriceDisplay(pack);
          });
        });
      }

      document.getElementById("send-btn").addEventListener("click", () => {
        window.open(buildWhatsAppLink(pack), "_blank");
      });

      updatePriceDisplay(pack);
      updateSendState(pack);
    }

    init();
  </script>
</body>
</html>
