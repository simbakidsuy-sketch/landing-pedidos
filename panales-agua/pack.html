<body>
  <div class="topbar">
    <span class="brand">SIMBA</span>
    <span class="tagline">Pañales para el Agua</span>
  </div>

  <div class="container">
    <a class="back-link" href="index.html">&larr; Volver a Pañales para el Agua</a>

    <div id="pack-root">Cargando...</div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="data/products.js"></script>
  <script src="data/packs.js"></script>
  <script src="assets/js/data-source.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const slug = params.get("slug");
    const root = document.getElementById("pack-root");

    const SHIPPING_OPTIONS = {
      pickup: {
        title: "Retiro en Aguada",
        detail: "A una cuadra del Palacio Legislativo. Coordinamos el retiro luego de confirmada la venta.",
        message: "Retiro en Aguada",
        cost: 0
      },
      montevideo: {
        title: "Envío en Montevideo — $U 200",
        detail: "Se suma al total del pedido.",
        message: "Envío en Montevideo",
        cost: 200
      },
      interior: {
        title: "Envío al resto del país (DAC)",
        detail: "El costo del envío se abona al recibir el pedido.",
        message: "Envío por DAC",
        cost: 0
      }
    };

    const FREE_SHIPPING_THRESHOLD = 3500;

    const PAYMENT_OPTIONS = {
      transferencia: {
        title: "Transferencia bancaria o depósito",
        detail: "Redes de cobranza (Abitab, Redpagos, etc.)",
        message: "Voy a abonar por transferencia bancaria o depósito en redes de cobranza, ¿me pasás el número de cuenta?"
      },
      tarjeta: {
        title: "Link de pago con tarjeta",
        detail: "Hasta 12 cuotas sin recargo.",
        message: "Voy a abonar con tarjeta, ¿podrías enviarme el link de pago?"
      }
    };

    const SHIPPING_FIELD_LABELS = {
      nombre: "Nombre y apellido",
      direccion: "Dirección de entrega",
      localidad: "Localidad y departamento",
      celular: "Celular de contacto"
    };

    // ---------- Estado ----------
    let PACK = null;
    let ADDONS = [];              // extras con descuento del pack (pack.addons)
    let stockMap = {};            // producto -> { diseño: stock }
    const SELECTORS = {};         // id del selector -> { product, qty (null = sin límite) }
    const SEL = {};               // id del selector -> { diseño: cantidad }
    const ADDON_STATE = [];       // por extra: { open, qty } (qty solo para extras sin diseños)
    let selectedShipping = "";
    let selectedPayment = "";
    let selectedUpsell = null;
    let dacMode = "";
    let shippingFields = {};

    function shippingFieldKeys() {
      if (selectedShipping === "pickup") return ["nombre"];
      if (selectedShipping === "montevideo") return ["nombre", "direccion", "celular"];
      if (selectedShipping === "interior") {
        if (dacMode === "agencia") return ["nombre", "localidad", "celular"];
        if (dacMode === "domicilio") return ["nombre", "direccion", "localidad", "celular"];
        return null;
      }
      return [];
    }

    function shippingFieldsHTML(keys) {
      if (!keys || keys.length === 0) return "";
      return `<div class="shipping-fields">` + keys.map(k => `
        <div class="field-group">
          <label>${SHIPPING_FIELD_LABELS[k]}</label>
          <input type="text" class="field-input" data-key="${k}" value="${(shippingFields[k] || "").replace(/"/g, "&quot;")}" placeholder="${SHIPPING_FIELD_LABELS[k]}">
        </div>`).join("") + `</div>`;
    }

    function shippingOptionsHTML() {
      return Object.entries(SHIPPING_OPTIONS).map(([value, opt]) => `
        <div class="option-card-wrap" data-group="shipping" data-value="${value}">
          <label class="option-card">
            <input type="radio" name="shipping" value="${value}">
            <div class="option-text">
              <strong>${opt.title}</strong>
              <span>${opt.detail}</span>
            </div>
          </label>
          <div class="option-inline-extra" id="extra-${value}"></div>
        </div>`).join("");
    }

    function renderShippingDetails() {
      Object.keys(SHIPPING_OPTIONS).forEach(v => {
        const el = document.getElementById(`extra-${v}`);
        if (el) el.innerHTML = "";
      });
      const container = document.getElementById(`extra-${selectedShipping}`);
      if (!container) return;

      if (selectedShipping === "interior") {
        const dacOption = (value, label) => `
          <label class="option-card ${dacMode === value ? "selected" : ""}">
            <input type="radio" name="dac-mode" value="${value}" ${dacMode === value ? "checked" : ""}>
            <div class="option-text"><strong>${label}</strong></div>
          </label>`;
        container.innerHTML =
          `<div class="option-list dac-mode-list">${dacOption("agencia", "Retiro en agencia")}${dacOption("domicilio", "Enviar a mi domicilio")}</div>` +
          shippingFieldsHTML(shippingFieldKeys());

        container.querySelectorAll('input[name="dac-mode"]').forEach(r => {
          r.addEventListener("change", e => {
            dacMode = e.target.value;
            renderShippingDetails();
            updateSendState();
          });
        });
      } else {
        container.innerHTML = shippingFieldsHTML(shippingFieldKeys());
      }

      container.querySelectorAll(".field-input").forEach(input => {
        input.addEventListener("input", e => {
          shippingFields[e.target.dataset.key] = e.target.value;
          updateSendState();
        });
      });
    }

    function formatMoney(n) {
      return "$U " + n.toLocaleString("es-UY");
    }

    function sortedVariants(variants) {
      return variants.slice().sort((a, b) => a.title.localeCompare(b.title, "es"));
    }

    // ---------- Galerías de diseños ----------
    function galleryHTML(variants, id) {
      return sortedVariants(variants).map(v => {
        const out = v.stock <= 0;
        const low = !out && v.stock <= 3;
        return `
        <div class="thumb-wrap ${out ? "out" : ""}" data-id="${id}" data-title="${v.title}">
          <div class="thumb ${out ? "out" : ""}">
            <img src="${v.image}" alt="${v.title}" loading="lazy">
            ${low ? '<div class="low-badge">🔥 ¡ÚLTIMAS UNIDADES!</div>' : ""}
            ${out ? '<div class="out-label">SIN STOCK</div>' : ""}
            <div class="count-badge"></div>
          </div>
          <div class="thumb-name">${v.title}</div>
        </div>`;
      }).join("");
    }

    function sizeChartHTML(url) {
      return `
        <a class="size-chart" href="${url}" target="_blank" rel="noopener">
          <div class="size-chart-title">📏 Tabla de talles</div>
          <img src="${url}" alt="Tabla de talles" loading="lazy">
          <span>Tocá la imagen para verla en grande</span>
        </a>`;
    }

    function registerSelector(id, product, qty) {
      SELECTORS[id] = { product, qty };
      SEL[id] = {};
    }

    function selTotal(id) {
      return Object.values(SEL[id] || {}).reduce((a, b) => a + b, 0);
    }

    // Unidades ya elegidas de un mismo producto en cualquier parte de la página
    // (componentes del pack y extras), para no pasarse del stock si el cliente
    // repite un diseño en dos lugares.
    function unitsUsed(product, title) {
      return Object.keys(SELECTORS).reduce(
        (n, id) => n + (SELECTORS[id].product === product ? (SEL[id][title] || 0) : 0), 0);
    }

    function progressText(qty, total) {
      if (qty === null) return total > 0 ? `Elegiste ${total} diseño${total > 1 ? "s" : ""}` : "Elegí los que quieras";
      return total >= qty ? `✅ Elegiste tus ${qty} diseño${qty > 1 ? "s" : ""}` : `Elegiste ${total} de ${qty}`;
    }

    function selectorHTML(id, prod, qty, sizeChart, hintText) {
      const hint = hintText || ((qty === null || qty > 1)
        ? "Tocá una foto para elegirla. Si querés el mismo diseño más de una vez, tocala de nuevo."
        : "Tocá una foto para elegirla.");
      return `
        <div class="hint">${hint}</div>
        ${sizeChart ? sizeChartHTML(sizeChart) : ""}
        <div class="gallery" id="gallery-${id}">${galleryHTML(prod.variants, id)}</div>
        <div class="comp-footer">
          <span class="comp-progress" id="progress-${id}">${progressText(qty, 0)}</span>
          <button type="button" class="clear-btn" id="clear-${id}" style="display:none">Limpiar selección</button>
        </div>`;
    }

    function paint(id) {
      document.querySelectorAll(`#gallery-${id} .thumb-wrap`).forEach(wrap => {
        const count = SEL[id][wrap.dataset.title] || 0;
        wrap.querySelector(".thumb").classList.toggle("selected", count > 0);
        wrap.querySelector(".count-badge").textContent = count > 0 ? String(count) : "";
      });
      const total = selTotal(id);
      document.getElementById(`progress-${id}`).textContent = progressText(SELECTORS[id].qty, total);
      document.getElementById(`clear-${id}`).style.display = total > 0 ? "inline-flex" : "none";
    }

    function bindSelector(id) {
      const s = SELECTORS[id];
      document.querySelectorAll(`#gallery-${id} .thumb-wrap:not(.out)`).forEach(wrap => {
        wrap.addEventListener("click", () => {
          const title = wrap.dataset.title;
          if (s.qty !== null && selTotal(id) >= s.qty) return;
          if (unitsUsed(s.product, title) >= stockMap[s.product][title]) return;
          SEL[id][title] = (SEL[id][title] || 0) + 1;
          paint(id);
          updateSendState();
        });
      });
      document.getElementById(`clear-${id}`).addEventListener("click", () => {
        SEL[id] = {};
        paint(id);
        updateSendState();
      });
    }

    function componentSatisfied(comp, total) {
      return comp.qty === null ? total >= 1 : total >= comp.qty;
    }

    // ---------- Extras con descuento ----------
    function addonUnitPrice(a) {
      return Math.round(a.basePrice * (1 - a.discount / 100));
    }

    // Cantidad de unidades de un extra: diseños elegidos (type "designs") o cantidad (type "plain").
    function addonUnits(k) {
      const st = ADDON_STATE[k];
      if (!st.open) return 0;
      return ADDONS[k].type === "plain" ? st.qty : selTotal(`a${k}`);
    }

    function addonHTML(k, prod) {
      const a = ADDONS[k];
      let panel;
      if (a.type === "plain") {
        panel = `
          <div class="qty-stepper">
            <span>Cantidad:</span>
            <button type="button" class="qty-btn" id="qty-minus-${k}">−</button>
            <strong id="qty-value-${k}">1</strong>
            <button type="button" class="qty-btn" id="qty-plus-${k}">+</button>
          </div>`;
      } else {
        panel = selectorHTML(`a${k}`, prod, null, a.sizeChart,
          "Tocá una foto para elegirla. Podés sumar todas las que quieras: si querés el mismo diseño más de una vez, tocala de nuevo.");
      }
      return `
        <div class="addon-block" id="addon-block-${k}">
          <div class="addon-question">¿Querés sumar ${a.noun} con ${a.discount}% de descuento?</div>
          <div class="addon-price">Con el descuento: <strong>${formatMoney(addonUnitPrice(a))} c/u</strong> <s>${formatMoney(a.basePrice)}</s></div>
          ${a.media ? `<video class="upsell-media" src="${a.media}" autoplay loop muted playsinline></video>` : ""}
          ${a.description ? `<p class="upsell-desc">${a.description}</p>` : ""}
          <button type="button" class="addon-btn" id="addon-btn-${k}">Sí, quiero</button>
          <div class="addon-panel" id="addon-panel-${k}" hidden>${panel}</div>
        </div>`;
    }

    function wireAddon(k) {
      const a = ADDONS[k];
      const st = ADDON_STATE[k];
      const btn = document.getElementById(`addon-btn-${k}`);
      const panel = document.getElementById(`addon-panel-${k}`);

      btn.addEventListener("click", () => {
        st.open = !st.open;
        panel.hidden = !st.open;
        btn.textContent = st.open ? "No, mejor no" : "Sí, quiero";
        btn.classList.toggle("addon-btn--open", st.open);
        if (a.type === "plain") {
          st.qty = st.open ? 1 : 0;
          document.getElementById(`qty-value-${k}`).textContent = "1";
        } else if (!st.open) {
          SEL[`a${k}`] = {};
          paint(`a${k}`);
        }
        updateSendState();
      });

      if (a.type === "plain") {
        document.getElementById(`qty-minus-${k}`).addEventListener("click", () => {
          st.qty = Math.max(1, st.qty - 1);
          document.getElementById(`qty-value-${k}`).textContent = String(st.qty);
        });
        document.getElementById(`qty-plus-${k}`).addEventListener("click", () => {
          st.qty += 1;
          document.getElementById(`qty-value-${k}`).textContent = String(st.qty);
        });
      } else {
        bindSelector(`a${k}`);
      }
    }

    function selectedUpsellOption() {
      if (!PACK.upsell || !selectedUpsell) return null;
      return PACK.upsell.options.find(o => o.id === selectedUpsell) || null;
    }

    // Precio interno del pedido (no se muestra en la landing, solo se calcula
    // para incluirlo en el mensaje final de WhatsApp).
    function orderSubtotal() {
      const base = PACK.mode === "individual"
        ? PACK.unitPrice * PACK.components.reduce((sum, c, ci) => sum + selTotal(`c${ci}`), 0)
        : PACK.price;
      const upsellOpt = selectedUpsellOption();
      const addons = ADDONS.reduce((sum, a, k) => sum + addonUnits(k) * addonUnitPrice(a), 0);
      return base + (upsellOpt ? upsellOpt.price : 0) + addons;
    }

    function setSectionError(errId, listId, msg) {
      const errEl = document.getElementById(errId);
      if (errEl) errEl.textContent = msg;
      if (listId) {
        const list = document.getElementById(listId);
        if (list) list.classList.add("has-error");
      }
    }

    function clearSectionError(errId, listId) {
      const errEl = document.getElementById(errId);
      if (errEl) errEl.textContent = "";
      if (listId) {
        const list = document.getElementById(listId);
        if (list) list.classList.remove("has-error");
      }
    }

    // Devuelve la primera sección incompleta (para el scroll + cartel al tocar "Enviar"), o null si está todo listo.
    function firstUnmetTarget() {
      for (let ci = 0; ci < PACK.components.length; ci++) {
        const comp = PACK.components[ci];
        const total = selTotal(`c${ci}`);
        if (!componentSatisfied(comp, total)) {
          return {
            el: document.getElementById(`gallery-c${ci}`),
            show: () => setSectionError(`comp-error-${ci}`, null,
              comp.qty === null
                ? "Elegí al menos un diseño"
                : `Te faltan diseños: elegiste ${total} de ${comp.qty}`)
          };
        }
      }
      if (!selectedShipping) {
        return { el: document.getElementById("shipping-options"),
          show: () => setSectionError("shipping-error", "shipping-options", "Elegí una opción de envío o retiro") };
      }
      if (selectedShipping === "interior" && !dacMode) {
        return { el: document.getElementById("shipping-options"),
          show: () => setSectionError("shipping-error", "shipping-options", "Elegí retiro en agencia o envío a domicilio") };
      }
      if (!selectedPayment) {
        return { el: document.getElementById("payment-options"),
          show: () => setSectionError("payment-error", "payment-options", "Elegí un medio de pago") };
      }
      return null;
    }

    function updateSendState() {
      const btn = document.getElementById("send-btn");
      const progress = document.getElementById("send-progress");
      const unmetIndex = PACK.components.findIndex((c, ci) => !componentSatisfied(c, selTotal(`c${ci}`)));

      // Limpiar los carteles de error de las secciones que ya se completaron.
      PACK.components.forEach((c, ci) => {
        if (componentSatisfied(c, selTotal(`c${ci}`))) clearSectionError(`comp-error-${ci}`);
      });
      if (selectedShipping && !(selectedShipping === "interior" && !dacMode)) clearSectionError("shipping-error", "shipping-options");
      if (selectedPayment) clearSectionError("payment-error", "payment-options");

      let blocking = null;
      if (unmetIndex !== -1) {
        const comp = PACK.components[unmetIndex];
        blocking = comp.qty === null
          ? "Elegí al menos un diseño"
          : `Elegiste ${selTotal(`c${unmetIndex}`)} de ${comp.qty} diseño${comp.qty > 1 ? "s" : ""}`;
      } else if (!selectedShipping) {
        blocking = "Elegí el envío o retiro";
      } else if (selectedShipping === "interior" && !dacMode) {
        blocking = "Elegí retiro en agencia o envío a domicilio";
      }

      if (!blocking && !selectedPayment) blocking = "Elegí el medio de pago";

      btn.classList.toggle("send-btn--incomplete", !!blocking);
      progress.textContent = blocking || "¡Listo! Todo elegido.";
    }

    function buildWhatsAppLink() {
      const payment = PAYMENT_OPTIONS[selectedPayment];

      const lines = ["Hola, quiero hacer un pedido:"];

      if (PACK.components.length > 0) {
        lines.push("");
        lines.push(`Quiero encargar: *${PACK.name}*`);
        lines.push("");
        lines.push("Ya vi los diseños, me gustarían estos:");
        PACK.components.forEach((comp, ci) => {
          Object.entries(SEL[`c${ci}`]).forEach(([title, count]) => {
            if (count <= 0) return;
            lines.push(`- ${comp.label}: ${title}${count > 1 ? ` (x${count})` : ""}`);
          });
        });
        const upsellOpt = selectedUpsellOption();
        if (upsellOpt) {
          lines.push("");
          lines.push(`Además, quiero sumar: ${upsellOpt.message}`);
        }
        ADDONS.forEach((a, k) => {
          if (addonUnits(k) <= 0) return;
          lines.push("");
          lines.push(`Además, quiero sumar con ${a.discount}% de descuento (${formatMoney(addonUnitPrice(a))} c/u):`);
          if (a.type === "plain") {
            lines.push(`- ${a.label}${ADDON_STATE[k].qty > 1 ? ` (x${ADDON_STATE[k].qty})` : ""}`);
          } else {
            Object.entries(SEL[`a${k}`]).forEach(([title, count]) => {
              if (count <= 0) return;
              lines.push(`- ${a.label}: ${title}${count > 1 ? ` (x${count})` : ""}`);
            });
          }
        });
      }

      // Solo se usan los datos del tipo de envío elegido (puede haber quedado texto de otra opción).
      const keys = shippingFieldKeys() || [];
      const val = k => (keys.includes(k) ? (shippingFields[k] || "").trim() : "");

      lines.push("");
      if (val("nombre")) lines.push(`Mi nombre es ${val("nombre")}.`);
      if (selectedShipping === "pickup") {
        lines.push("Cuando el pedido esté listo, lo voy a retirar en su Pick-up de Aguada.");
      } else if (selectedShipping === "montevideo") {
        lines.push(`Quiero que me lo envíen en Montevideo${val("direccion") ? ` a ${val("direccion")}` : ""}.`);
      } else if (selectedShipping === "interior") {
        if (dacMode === "agencia") {
          lines.push(`Quiero que me lo envíen por DAC, para retirarlo en la agencia${val("localidad") ? ` de ${val("localidad")}` : ""}.`);
        } else {
          const donde = [val("direccion"), val("localidad")].filter(Boolean).join(", ");
          lines.push(`Quiero que me lo envíen por DAC a mi domicilio${donde ? ` en ${donde}` : ""}.`);
        }
      }
      if (val("celular")) lines.push(`Mi celular es ${val("celular")}.`);

      lines.push("");
      lines.push(payment.message);

      if (PACK.components.length > 0) {
        const subtotal = orderSubtotal();
        lines.push("");
        if (selectedShipping === "montevideo") {
          if (subtotal >= FREE_SHIPPING_THRESHOLD) {
            lines.push(`Total del pedido: ${formatMoney(subtotal)}`);
            lines.push("Envío: GRATIS");
          } else {
            lines.push(`Sub-total del pedido: ${formatMoney(subtotal)}`);
            lines.push(`Envío: ${formatMoney(SHIPPING_OPTIONS.montevideo.cost)}`);
            lines.push(`Total: ${formatMoney(subtotal + SHIPPING_OPTIONS.montevideo.cost)}`);
          }
        } else if (selectedShipping === "interior" && subtotal >= FREE_SHIPPING_THRESHOLD) {
          lines.push(`Total del pedido: ${formatMoney(subtotal)}`);
          lines.push("Envío: GRATIS");
        } else {
          lines.push(`Total del pedido: ${formatMoney(subtotal)}`);
        }
      }

      const text = encodeURIComponent(lines.join("\n"));
      return `https://wa.me/${window.SIMBA_CONFIG.whatsappNumber}?text=${text}`;
    }

    function upsellHTML(pack) {
      if (!pack.upsell) return "";
      const u = pack.upsell;
      const optionsHTML = u.options.map(o => `
        <div class="upsell-option" data-id="${o.id}">
          <strong>${o.label}</strong>
          <span>${formatMoney(o.price)}</span>
        </div>`).join("");
      const media = u.mediaType === "video"
        ? `<video class="upsell-media" src="${u.media}" autoplay loop muted playsinline></video>`
        : `<img class="upsell-media" src="${u.media}" alt="${u.title}" loading="lazy">`;
      return `
        <div class="upsell-block">
          <h3>${u.title}</h3>
          ${media}
          <p class="upsell-desc">${u.description}</p>
          <div class="upsell-options">${optionsHTML}</div>
        </div>`;
    }

    function optionCardsHTML(groupName, options) {
      return Object.entries(options).map(([value, opt]) => `
        <label class="option-card" data-group="${groupName}">
          <input type="radio" name="${groupName}" value="${value}">
          <div class="option-text">
            <strong>${opt.title}</strong>
            <span>${opt.detail}</span>
          </div>
        </label>`).join("");
    }

    async function init() {
      const [packs, products] = await Promise.all([getPacks(), getProducts()]);
      const pack = packs.find(p => p.slug === slug);

      if (!pack) {
        root.innerHTML = "<p>No encontramos ese pack. <a href='index.html'>Volver</a></p>";
        return;
      }

      PACK = pack;
      ADDONS = pack.addons || [];
      document.getElementById("page-title").textContent = `${pack.name} | SIMBA Kids UY`;

      const productKeys = new Set(pack.components.map(c => c.product));
      ADDONS.forEach(a => { if (a.type !== "plain") productKeys.add(a.product); });
      productKeys.forEach(k => {
        stockMap[k] = {};
        products[k].variants.forEach(v => { stockMap[k][v.title] = v.stock; });
      });

      pack.components.forEach((comp, ci) => registerSelector(`c${ci}`, comp.product, comp.qty));
      ADDONS.forEach((a, k) => {
        ADDON_STATE[k] = { open: false, qty: 0 };
        if (a.type !== "plain") registerSelector(`a${k}`, a.product, null);
      });

      const componentBlocks = pack.components.map((comp, ci) => {
        const qtyLabel = comp.qty === null ? " (elegí los que quieras)" : ` (elegí ${comp.qty})`;
        return `
          <div class="component-block">
            <h3>${comp.label}${qtyLabel}</h3>
            ${selectorHTML(`c${ci}`, products[comp.product], comp.qty, comp.sizeChart)}
            <div class="section-error" id="comp-error-${ci}"></div>
          </div>`;
      }).join("");

      root.innerHTML = `
        <div class="pack-header">
          <img src="${pack.image}" alt="${pack.name}" class="${pack.imageStyle === "logo" ? "logo-image" : ""}">
          <div class="meta">
            <h1>${pack.name}</h1>
            <div class="subtitle">${pack.subtitle}</div>
          </div>
        </div>
        ${componentBlocks}
        ${upsellHTML(pack)}
        ${ADDONS.map((a, k) => addonHTML(k, a.type === "plain" ? null : products[a.product])).join("")}
        <div class="component-block">
          <h3>Retiro o Envío (gratis para compras mayores a $3.500)</h3>
          <div class="option-list" id="shipping-options">
            ${shippingOptionsHTML()}
          </div>
          <div class="section-error" id="shipping-error"></div>
        </div>
        <div class="component-block">
          <h3>Medio de pago</h3>
          <div class="option-list" id="payment-options">
            ${optionCardsHTML("payment", PAYMENT_OPTIONS)}
          </div>
          <div class="section-error" id="payment-error"></div>
        </div>
        <div class="send-bar">
          <button class="send-btn" id="send-btn">Enviar info por WhatsApp</button>
          <div class="send-progress" id="send-progress"></div>
        </div>
      `;

      pack.components.forEach((comp, ci) => bindSelector(`c${ci}`));
      ADDONS.forEach((a, k) => wireAddon(k));

      root.querySelectorAll('input[name="shipping"]').forEach(radio => {
        radio.addEventListener("change", e => {
          selectedShipping = e.target.value;
          if (selectedShipping !== "interior") dacMode = "";
          root.querySelectorAll('.option-card-wrap[data-group="shipping"]').forEach(card => {
            card.classList.toggle("selected", card.querySelector("input").checked);
          });
          renderShippingDetails();
          updateSendState();
        });
      });

      root.querySelectorAll('input[name="payment"]').forEach(radio => {
        radio.addEventListener("change", e => {
          selectedPayment = e.target.value;
          root.querySelectorAll('.option-card[data-group="payment"]').forEach(card => {
            card.classList.toggle("selected", card.querySelector("input").checked);
          });
          updateSendState();
        });
      });

      if (pack.upsell) {
        root.querySelectorAll(".upsell-option").forEach(el => {
          el.addEventListener("click", () => {
            const id = el.dataset.id;
            selectedUpsell = selectedUpsell === id ? null : id;
            root.querySelectorAll(".upsell-option").forEach(o => {
              o.classList.toggle("selected", o.dataset.id === selectedUpsell);
            });
          });
        });
      }

      document.getElementById("send-btn").addEventListener("click", () => {
        const problem = firstUnmetTarget();
        if (problem) {
          problem.show();
          if (problem.el) problem.el.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
        if (typeof fbq === "function") fbq("track", "Contact");
        window.open(buildWhatsAppLink(), "_blank");
      });

      updateSendState();
    }

    init();
  </script>
</body>
</html>
